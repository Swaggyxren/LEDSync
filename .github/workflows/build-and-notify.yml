name: Build Android APK & Telegram Notify

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build & Notify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Accept Android SDK Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo -e "89339e075775f199293ccf97f9e29ad701ac1e5d\n7a9331941639fede0e88f335250d36742e7bfe7c\n24333f8a6378b6e4d16d4f6f9e51626c68d67555\nd56f5187479451eabf01fb78af6dfcb131a6481e\ne984671924535cd86243142109477d1091c43010" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Decode Release Keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > android/app/ledsync-release.keystore
            echo "Release keystore decoded successfully."
          else
            echo "RELEASE_KEYSTORE_BASE64 secret not set. Falling back to debug signing."
          fi

      - name: Build Release APK
        env:
          RELEASE_KEYSTORE_PATH: ledsync-release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          cd android && ./gradlew assembleRelease --no-daemon
          RAW_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -n "$RAW_APK" ] && [ -f "$RAW_APK" ]; then
            cp "$RAW_APK" app/build/outputs/apk/release/LEDSync-v2.0.1-release.apk
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LEDSync-v2.0.1-release-apk
          path: android/app/build/outputs/apk/release/LEDSync-v2.0.1-release.apk
          if-no-files-found: error

      - name: Send Telegram Notification & APK
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram bot token or chat ID secret is not set. Skipping Telegram notification."
            exit 0
          fi

          SHORT_SHA=$(git rev-parse --short HEAD)
          RAW_COMMIT_MSG=$(git log -1 --pretty=format:"%s")
          CLEAN_COMMIT_MSG=$(echo "$RAW_COMMIT_MSG" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')
          COMMIT_AUTHOR=$(git log -1 --pretty=format:"%an")
          BRANCH_NAME="${GITHUB_REF_NAME:-unknown}"
          JOB_STATUS="${{ job.status }}"

          APK_PATH="android/app/build/outputs/apk/release/LEDSync-v2.0.1-release.apk"

          if [ "$JOB_STATUS" = "success" ] && [ -f "$APK_PATH" ]; then
            CAPTION=$(printf "🚀 <b>LEDSync v2.0.1 Release Build Success</b>\n\n📌 <b>Commit:</b> <code>%s</code>\n📝 <b>Message:</b> %s\n👤 <b>Author:</b> %s\n🌿 <b>Branch:</b> %s" "$SHORT_SHA" "$CLEAN_COMMIT_MSG" "$COMMIT_AUTHOR" "$BRANCH_NAME")

            RESPONSE=$(curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
              -F chat_id="${TELEGRAM_CHAT_ID}" \
              -F document=@"${APK_PATH}" \
              -F caption="${CAPTION}" \
              -F parse_mode="HTML")
            echo "Telegram API Response: $RESPONSE"
          else
            CAPTION=$(printf "❌ <b>LEDSync Release Build Failed</b>\n\n📌 <b>Commit:</b> <code>%s</code>\n📝 <b>Message:</b> %s\n👤 <b>Author:</b> %s\n🌿 <b>Branch:</b> %s" "$SHORT_SHA" "$CLEAN_COMMIT_MSG" "$COMMIT_AUTHOR" "$BRANCH_NAME")

            RESPONSE=$(curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" \
              -d text="${CAPTION}" \
              -d parse_mode="HTML")
            echo "Telegram API Response: $RESPONSE"
          fi
